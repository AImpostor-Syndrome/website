# Build the Eleventy site and deploy it to GitHub Pages.
#
# This is what makes "publishing = a commit to main" literally true (US-3/#4):
# push to main, this builds, Pages serves the result.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Least privilege: read the repo, write only the Pages deployment + its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # configure-pages resolves the site's base path and exports it, so the
      # build emits correct links whether the site is served from
      # github.io/website/ or from the custom domain's root.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      # Fails the deploy if any asset link doesn't resolve (#6) — an unstyled
      # site should never reach production silently again.
      - name: Check asset links
        run: npm run check
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
